name: loyalty_benefit_app
description: "SaaS de lealtad multi-industria."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  # Aquí le decimos a Flutter que incluya la carpeta de imágenes
  assets:
    - assets/icon/

# Aquí va la configuración del generador de íconos
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    theme_color: "#4F46E5"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
